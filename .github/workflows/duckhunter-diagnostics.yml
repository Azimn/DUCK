name: Duckhunter Diagnostics

on:
  push:
    branches:
      - duckhunter-eval-20260910
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m duck.duckhunter_diagnostics_v010 --output duckhunter-diagnostics.json
      - name: Upload Duckhunter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duckhunter-diagnostics
          path: duckhunter-diagnostics.json
