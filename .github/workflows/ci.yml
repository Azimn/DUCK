name: DUCK CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python tools/check_docs.py
      - run: python -m duck.regulation_evaluation
      - run: python -m duck.planning_evaluation
      - run: python -m duck.motivated_evaluation
      - run: python -m duck.planning_simulation --out-dir simulation_results/planning-v09
      - run: python -m duck.motivated_simulation_v010 --out-dir simulation_results/motivated-v010
      - run: python -m pytest --junitxml=pytest-report-${{ matrix.python-version }}.xml
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: pytest-report-${{ matrix.python-version }}.xml
          if-no-files-found: ignore
      - run: python -m duck.evaluation
      - run: python -m duck.simulation_lab --out-dir simulation_results/baseline
      - run: python -m duck.simulation_lab_v06 --out-dir simulation_results/v06
      - run: python -m duck.life_simulation --out-dir simulation_results/life-v07
      - run: python -m duck.agency_evaluation
      - run: python -m duck.agency_simulation --out-dir simulation_results/agency-v08

  targeted-discriminator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m duck.discriminator --seed 91 --ticks 200 --output discriminator-report.json
      - name: Upload discriminator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-discriminator
          path: discriminator-report.json


  component-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m duck.component_comparison --output component-comparison.json --benchmark
      - name: Upload component comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-comparison
          path: component-comparison.json
