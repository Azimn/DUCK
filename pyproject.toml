[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duck-subjective-simulator"
version = "0.7.0"
description = "A persistent computational subject simulator with bounded first-person access, memory, continuity, learning, agency, regulation, relationship reinterpretation, and longitudinal life simulation."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
duck = "duck.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
