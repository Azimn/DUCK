[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duck-subjective-simulator"
version = "0.9.0"
description = "A persistent computational subject simulator with bounded first-person access, lived continuity, motivated prospective agency, endogenous goal formation, counterfactual planning, learning, regulation, and longitudinal simulation."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
duck = "duck.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"