[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micropsi-duck"
version = "0.10.0"
description = "MicroPsiDUCK: a persistent motivated-cognition simulator with prose-only first-person access, private interior persistence, associative cognition, modulation, planning, learning, regulation, and longitudinal simulation."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
duck = "duck.cli:main"
micropsiduck = "duck.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
